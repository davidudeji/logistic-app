<div class="app-shell" [class.landing-layout]="isLandingLayout()">
  <!-- Sidebar — hidden on landing -->
  @if (!isLandingLayout()) {
    <app-sidebar></app-sidebar>
  }

  <!-- Main Content Area -->
  <div class="main-area">
    <router-outlet></router-outlet>
  </div>
</div>

<!-- Global toast notifications -->
<app-toast-outlet></app-toast-outlet>
